<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zazen Designs | Homepage Starting Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414;
    --ink-soft:#5C5C5C;
    --bg:#fff;
    --bg-dim:#F7F7F5;
    --line:#EAEAE6;
    --accent:#1F6E5C;
    --maxw:1320px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  h1,h2{font-family:'Instrument Sans',sans-serif;font-weight:800;letter-spacing:-0.02em;margin:0;}
  a{color:inherit;text-decoration:none;}
  button{font-family:'Instrument Sans',sans-serif;cursor:pointer;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 40px;}

  /* Nav */
  nav{position:absolute;top:0;left:0;right:0;z-index:20;padding:26px 0;}
  .nav-inner{max-width:var(--maxw);margin:0 auto;padding:0 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;color:#fff;letter-spacing:-0.02em;}
  .logo .mark{width:30px;height:30px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .quote-pill{display:flex;align-items:center;background:#fff;border-radius:999px;padding:6px;box-shadow:0 4px 24px rgba(0,0,0,0.18);font-size:14px;}
  .quote-pill .seg{padding:11px 22px;border-right:1px solid #ECECEC;color:#6B6B6B;white-space:nowrap;}
  .quote-pill .go{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:11px 24px;font-weight:600;font-size:14px;margin-left:4px;white-space:nowrap;}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .list-btn{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.45);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;backdrop-filter:blur(4px);}
  .menu-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;backdrop-filter:blur(4px);}

  /* Hero — real photo with dark overlay */
  .hero{position:relative;height:420px;overflow:hidden;}
  .hero img.hero-bg{width:100%;height:100%;object-fit:cover;display:block;}
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 35%, rgba(0,0,0,0.15) 65%, rgba(0,0,0,0.6) 100%);
  }
  .hero-copy{position:absolute;left:0;right:0;top:38%;text-align:center;color:#fff;z-index:10;padding:0 24px;}
  .hero-copy h1{font-size:48px;color:#fff;margin-bottom:14px;}
  .hero-copy p{font-size:16px;font-weight:500;opacity:0.9;margin:0;}

  /* Rows */
  .row-section{padding:44px 0 8px;}
  .row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .row-head h2{font-size:21px;font-weight:700;}
  .card-row{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
  }
  @media (min-width:700px){
    .card-row{grid-template-columns:repeat(3, 1fr);}
  }
  @media (min-width:1024px){
    .card-row{grid-template-columns:repeat(4, 1fr);} /* laptop */
  }
  @media (min-width:1440px){
    .card-row{grid-template-columns:repeat(5, 1fr);} /* above laptop */
  }
  .p-card{width:100%;}
  .p-card-img{
    position:relative;border-radius:12px;overflow:hidden;height:200px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-dim);
  }
  .p-card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
  .p-card:hover .p-card-img img{transform:scale(1.04);}
  .p-card-img .ph-icon{opacity:0.35;font-size:13px;font-weight:600;color:#fff;letter-spacing:0.03em;text-align:center;padding:0 20px;}
  .p-tag{position:absolute;top:12px;left:12px;background:#141414;color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:4px;z-index:2;}
  .p-heart{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;}
  .p-card h3{font-size:15px;font-weight:600;margin-bottom:4px;}
  .p-meta{font-size:13.5px;color:var(--ink-soft);margin-bottom:2px;}
  .p-meta .star{color:var(--ink);font-weight:600;}
  .p-price{font-size:13.5px;margin-top:4px;}
  .p-save{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:2px;}

  @media (max-width: 980px){
    .quote-pill{display:none;}
    nav{position:relative;background:var(--ink);padding:18px 0;}
    .hero{height:340px;}
    .hero-copy{top:32%;}
    .hero-copy h1{font-size:30px;}
    .hero-copy p{font-size:14px;}
    .wrap{padding:0 20px;}
    .nav-inner{padding:0 20px;}
  }
</style>
</head>
<body>

<div class="hero">
  <img class="hero-bg" src="hero.jpg" alt="Aerial view of a mountain home surrounded by forest">
  <nav>
    <div class="nav-inner">
      <div class="logo"><span class="mark">禅</span> Zazen Designs</div>
      <div class="quote-pill">
        <div class="seg">Project Type</div>
        <div class="seg">Budget</div>
        <div class="seg">Timeline</div>
        <button class="go">Get a Quote</button>
      </div>
      <div class="nav-right">
        <a href="#" class="list-btn">Get Started</a>
        <div class="menu-btn">☰</div>
      </div>
    </div>
  </nav>
  <div class="hero-copy">
    <h1>Websites people actually stay on</h1>
    <p>Modern design. Fast builds. No bloated templates, no bloated invoices.</p>
  </div>
</div>

<div class="wrap row-section">
  <div class="row-head">
    <h2>Recent projects</h2>
  </div>
  <div class="card-row" id="row1"></div>
</div>

<script>
  const row1 = [
    { name:"Gnostic Society", rating:5.0, beds:"Educational · WordPress build", price:"4-week turnaround", save:null, tag:"Featured", img:"assets/gnostic-society.webp", link:"https://savannahgnosis.com/" },
    { name:"903 Truck Beds", rating:4.9, beds:"Manufacturing · Custom build", price:"5-week turnaround", save:null, tag:"Featured", img:"assets/903-truck-beds.webp", link:"https://903truckbeds.com/" },
    { name:"Steel Rising", rating:5.0, beds:"Industrial · Custom build", price:"5-week turnaround", save:"~$800 less than agency rate", tag:"Featured", img:"assets/steel-rising.webp", link:"https://steelrising.us/" },
    { name:"Adtech Motors", rating:4.8, beds:"Automotive · Custom build", price:"6-week turnaround", save:null, tag:"Featured", img:"assets/adtech-motors.webp", link:"https://adtechmotors.com/" },
    { name:"Packeasy Rentals", rating:5.0, beds:"Local SEO + Stripe checkout", price:"WordPress + Next.js build", save:"~$1,200 less than agency rate", tag:"Featured", img:"assets/packeasy-rentals.webp", link:"https://packeasyrentals.com/" },
    { name:"Site for a Real Estate Agent", rating:4.8, beds:"Custom build", price:"5-week turnaround", save:null, tag:null },
    { name:"Site for a Law Firm", rating:5.0, beds:"WordPress build", price:"6-week turnaround", save:"~$800 less than agency rate", tag:null },
    { name:"Site for a Med Spa", rating:4.8, beds:"Custom build", price:"5-week turnaround", save:null, tag:null },
    { name:"Booking Platform for a Detailer", rating:5.0, beds:"Custom web app", price:"Dynamic pricing tool", save:"~$2,400 less than agency rate", tag:"Luxury" },
    { name:"Storefront for a Boutique", rating:"New", beds:"Shopify build", price:"3-week turnaround", save:null, tag:null },
    { name:"Quote Tool for a Concrete Co.", rating:4.9, beds:"Custom web app", price:"Pricing calculator", save:null, tag:null },
    { name:"Portal for a Property Manager", rating:"New", beds:"Custom web app", price:"Client login system", save:"~$1,900 less than agency rate", tag:null },
    { name:"Site for a Nonprofit", rating:5.0, beds:"WordPress build", price:"4-week turnaround", save:"~$650 less than agency rate", tag:"Luxury" },
    { name:"Site for a Landscaper", rating:4.8, beds:"WordPress build", price:"4-week turnaround", save:null, tag:null },
    { name:"Site for a Dental Practice", rating:5.0, beds:"Custom build", price:"5-week turnaround", save:"~$700 less than agency rate", tag:"Luxury" },
    { name:"Storefront for a Boat Dealer", rating:4.7, beds:"WooCommerce + SEO", price:"Local SEO retainer", save:null, tag:null },
    { name:"Site for a Roofing Company", rating:4.9, beds:"WordPress build", price:"4-week turnaround", save:"~$550 less than agency rate", tag:null },
    { name:"Booking Tool for a Charter Co.", rating:"New", beds:"Custom web app", price:"Dynamic pricing tool", save:null, tag:"Luxury" },
    { name:"Site for a Veterinary Clinic", rating:5.0, beds:"Custom build", price:"5-week turnaround", save:"~$600 less than agency rate", tag:null },
    { name:"Storefront for a Furniture Co.", rating:4.8, beds:"Shopify build", price:"3-week turnaround", save:null, tag:null },
  ];

  const gradients = [
    'linear-gradient(135deg,#C4573B,#8f3a26)',
    'linear-gradient(135deg,#1F6E5C,#123f34)',
    'linear-gradient(135deg,#3F5C63,#22343a)',
    'linear-gradient(135deg,#B08650,#7a5a32)',
    'linear-gradient(135deg,#5C4A6E,#372c44)',
    'linear-gradient(135deg,#2E5C4A,#183a2d)',
    'linear-gradient(135deg,#6E4A3F,#402a24)',
    'linear-gradient(135deg,#4A5C6E,#293846)',
    'linear-gradient(135deg,#6E5C2E,#463b1c)',
    'linear-gradient(135deg,#3F3F5C,#242438)'
  ];

  function starOrNew(v){ return v==="New" ? "New" : `★ ${v}`; }

  function renderRow(id, data, gradOffset){
    const el = document.getElementById(id);
    el.innerHTML = data.map((p,i) => {
      const media = p.img
        ? `<img src="${p.img}" alt="${p.name} project screenshot" loading="lazy">`
        : `<div class="ph-icon">Photo placeholder<br>— swap for project screenshot</div>`;
      const card = `
        <div class="p-card-img" style="${p.img ? '' : `background:${gradients[(i+gradOffset)%gradients.length]}`}">
          ${media}
          ${p.tag ? `<div class="p-tag">✦ ${p.tag}</div>` : ''}
          <div class="p-heart">♡</div>
        </div>
        <h3>${p.name}</h3>
        <div class="p-meta"><span class="star">${starOrNew(p.rating)}</span> &nbsp;${p.beds}</div>
        <div class="p-price">${p.price}</div>
        ${p.save ? `<div class="p-save">${p.save}</div>` : ''}
      `;
      return p.link
        ? `<a class="p-card" href="${p.link}" target="_blank" rel="noopener">${card}</a>`
        : `<div class="p-card">${card}</div>`;
    }).join('');
  }
  renderRow('row1', row1, 0);
</script>

</body>
</html>
