<!DOCTYPE html>
<!-- deploy-trigger -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zazen Designs | Homepage Starting Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414;
    --ink-soft:#5C5C5C;
    --bg:#fff;
    --bg-dim:#F7F7F5;
    --line:#EAEAE6;
    --accent:#1F6E5C;
    --maxw:1832px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  h1,h2{font-family:'Instrument Sans',sans-serif;font-weight:700;letter-spacing:-0.02em;margin:0;}
  a{color:inherit;text-decoration:none;}
  button{font-family:'Instrument Sans',sans-serif;cursor:pointer;}
  /* Padding scale copied from wander.com: 24px mobile, 32px at 1024px+, 48px at 1536px+ */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
  @media (min-width:1024px){ .wrap{padding:0 32px;} }
  @media (min-width:1536px){ .wrap{padding:0 48px;} }

  /* Nav */
  nav{position:absolute;top:0;left:0;right:0;z-index:20;padding:26px 0;}
  .nav-inner{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  @media (min-width:1024px){ .nav-inner{padding:0 32px;} }
  @media (min-width:1536px){ .nav-inner{padding:0 48px;} }
  .logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;color:#fff;letter-spacing:-0.02em;}
  .logo .mark{width:30px;height:30px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .quote-pill{display:flex;align-items:center;background:#fff;border-radius:999px;padding:6px;box-shadow:0 4px 24px rgba(0,0,0,0.18);font-size:14px;}
  .quote-pill .seg{padding:11px 22px;border-right:1px solid #ECECEC;color:#6B6B6B;white-space:nowrap;}
  .quote-pill .go{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:11px 24px;font-weight:600;font-size:14px;margin-left:4px;white-space:nowrap;}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .list-btn{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.45);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;backdrop-filter:blur(4px);}
  .menu-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;backdrop-filter:blur(4px);}

  /* Hero — video with dark overlay */
  .hero{position:relative;height:420px;overflow:hidden;background:#141414;}
  .hero video.hero-bg{width:100%;height:100%;object-fit:cover;display:block;}
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.62) 35%, rgba(0,0,0,0.62) 65%, rgba(0,0,0,0.9) 100%);
  }
  .hero-copy{position:absolute;left:0;right:0;top:44%;text-align:center;color:#fff;z-index:10;padding:0 24px;}
  .hero-copy h1{font-family:'Instrument Sans',sans-serif;font-weight:550;font-size:52px;line-height:56px;letter-spacing:-1.04px;color:#fff;margin-bottom:14px;}
  .hero-copy p{font-family:'Instrument Sans',sans-serif;font-weight:450;font-size:18px;line-height:24px;letter-spacing:-0.16px;opacity:0.9;margin:0;}
  .hero-rating{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;}
  .hero-rating .stars{font-size:16px;letter-spacing:2px;color:#fff;opacity:0.95;}
  .hero-rating .rating-sep{opacity:0.5;}

  /* Rows */
  .row-section{padding-top:44px;padding-bottom:8px;}
  .row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .row-head h2{font-family:'Instrument Sans',sans-serif;font-weight:550;font-size:16px;line-height:20px;}
  /* Column breakpoints copied from wander.com's card row: 1 → 4 (1024px) → 5 (1280px) */
  .card-row{
    display:grid;
    grid-template-columns:repeat(1, 1fr); /* phone + tablet: one box per row */
    gap:20px;
  }
  @media (min-width:1024px){
    .card-row{grid-template-columns:repeat(4, 1fr);}
  }
  @media (min-width:1280px){
    .card-row{grid-template-columns:repeat(5, 1fr);}
  }
  .p-card{width:100%;}
  .p-card-img{
    position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1/1;margin-bottom:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-dim);
  }
  .p-card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
  .p-card:hover .p-card-img img{transform:scale(1.04);}
  .p-card-img .ph-icon{opacity:0.35;font-size:13px;font-weight:600;color:#fff;letter-spacing:0.03em;text-align:center;padding:0 20px;}
  .p-tag{
    position:absolute;top:12px;left:12px;z-index:2;
    background:rgba(0,0,0,0.18);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(0,0,0,0.05);
    color:#fff;font-size:13px;font-weight:450;padding:8px 12px 8px 10px;border-radius:999px;
    display:flex;align-items:center;gap:6px;
  }
  .p-tag .spark{width:13px;height:13px;display:block;}
  .p-heart{
    position:absolute;top:12px;right:12px;z-index:2;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.45));
  }
  .p-heart svg{width:24px;height:24px;display:block;}
  .p-card h3{font-size:15px;font-weight:600;margin-bottom:4px;}
  .p-meta{font-size:13.5px;color:var(--ink-soft);margin-bottom:2px;}
  .p-meta .star{color:var(--ink);font-weight:600;}
  .p-price{font-size:13.5px;margin-top:4px;}
  .p-save{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:2px;}

  /* Showcase slider — matches project grid width */
  .showcase-wrap{margin-top:56px;}
  .showcase{position:relative;width:100%;height:720px;overflow:hidden;border-radius:16px;background:#141414;}
  .showcase-slide{
    position:absolute;inset:0;
    opacity:0;
    transform:translateY(-100%);
    transition:transform 1.3s cubic-bezier(0.65,0,0.35,1), opacity 1.3s ease;
    pointer-events:none;
  }
  .showcase-slide img{width:100%;height:100%;object-fit:cover;display:block;}
  .showcase-slide.is-active{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
    z-index:2;
  }
  .showcase-slide.is-prev{
    transform:translateY(100%);
    z-index:1;
  }
  .showcase::after{
    content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.75) 100%);
  }
  .showcase-copy{
    position:absolute;left:0;right:0;bottom:0;z-index:4;color:#fff;
    padding:24px 24px 32px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  }
  @media (min-width:1024px){ .showcase-copy{padding:28px 32px 36px;} }
  @media (min-width:1536px){ .showcase-copy{padding:32px 48px 40px;} }
  .showcase-copy h2{font-size:28px;font-weight:600;letter-spacing:-0.02em;margin-bottom:6px;}
  .showcase-copy p{font-size:15px;font-weight:450;opacity:0.85;margin:0;max-width:520px;}
  .showcase-dots{display:flex;gap:8px;}
  .showcase-dots button{
    width:8px;height:8px;border-radius:50%;border:none;background:rgba(255,255,255,0.4);
    padding:0;transition:background 0.3s ease, transform 0.3s ease;
  }
  .showcase-dots button.is-active{background:#fff;transform:scale(1.3);}

  @media (max-width: 980px){
    .showcase{height:520px;}
    .showcase-copy{flex-direction:column;align-items:flex-start;gap:14px;padding:18px 18px 22px;}
    .showcase-copy h2{font-size:21px;}
    .showcase-copy p{font-size:13.5px;}
  }
  @media (max-width: 980px){
    .quote-pill{display:none;}
    nav{position:relative;background:var(--ink);padding:18px 0;}
    .hero{height:340px;}
    .hero-copy{top:32%;}
    .hero-copy h1{font-size:30px;}
    .hero-copy p{font-size:14px;}
  }
</style>
</head>
<body>

<div class="hero">
  <video class="hero-bg" autoplay muted loop playsinline poster="hero.jpg">
    <source src="assets/hero-video.mp4" type="video/mp4">
  </video>
  <nav>
    <div class="nav-inner">
      <div class="logo"><span class="mark">禅</span> Zazen Designs</div>
      <div class="quote-pill">
        <div class="seg">Project Type</div>
        <div class="seg">Budget</div>
        <div class="seg">Timeline</div>
        <button class="go">Get a Quote</button>
      </div>
      <div class="nav-right">
        <a href="#" class="list-btn">Get Started</a>
        <div class="menu-btn">☰</div>
      </div>
    </div>
  </nav>
  <div class="hero-copy">
    <h1>A web designer you can trust</h1>
    <p class="hero-rating"><span class="stars">★★★★★</span><span class="rating-sep">·</span>5/5 &nbsp;—&nbsp; Over 80 five-star reviews since 2010</p>
  </div>
</div>

<div class="wrap row-section">
  <div class="row-head">
    <h2>Recent projects</h2>
  </div>
  <div class="card-row" id="row1"></div>
</div>

<div class="wrap showcase-wrap">
<div class="showcase" id="showcase">
  <div id="showcase-slides"></div>
  <div class="showcase-copy">
      <div>
        <h2 id="showcase-title"></h2>
        <p id="showcase-desc"></p>
      </div>
      <div class="showcase-dots" id="showcase-dots"></div>
  </div>
</div>
</div>

<script>
  const row1 = [
    { name:"Benjamin's Mobile Detailing", rating:5.0, beds:"Auto detailing · Custom build", price:"3-week turnaround", save:null, tag:null, img:"assets/benjamins-mobile-detailing.webp", link:"https://benjaminsmobiledetailing.com/" },
    { name:"Altamont PT", rating:5.0, beds:"Physical therapy · Custom build", price:"5-week turnaround", save:null, tag:null, img:"assets/altamont-pt.webp", link:"https://altamontphysicaltherapy.com/" },
    { name:"First Construction Corp", rating:4.8, beds:"Roofing · WordPress build", price:"4-week turnaround", save:null, tag:null, img:"assets/first-construction-corp.webp", link:"https://first.zazendesigns.website/" },
    { name:"Garage Door Resources", rating:4.9, beds:"Garage doors · WordPress build", price:"4-week turnaround", save:null, tag:null, img:"assets/garage-door-resources.webp", link:"https://garagedoorresources.com/" },
    { name:"Packeasy Rentals", rating:5.0, beds:"Local SEO + Stripe checkout", price:"WordPress + Next.js build", save:"~$1,200 less than agency rate", tag:"Featured", img:"assets/packeasy-rentals.webp", link:"https://packeasyrentals.com/" },
    { name:"Custom Booking Application", rating:"New", beds:"Next.js · Booking + Google Sheets", price:"Custom web app", save:null, tag:null, img:"assets/custom-booking-application.webp", link:"https://detailing-form.vercel.app/" },
    { name:"903 Truck Beds", rating:4.9, beds:"Manufacturing · Custom build", price:"5-week turnaround", save:null, tag:"Featured", img:"assets/903-truck-beds.webp", link:"https://903truckbeds.com/" },
    { name:"Dinosaw", rating:5.0, beds:"E-commerce · Tooling catalog", price:"6-week turnaround", save:"~$900 less than agency rate", tag:null, img:"assets/dinosaw.webp", link:"https://dinosaw.com/" },
    { name:"Robles Concrete — Pricing Calculator", rating:"New", beds:"React/Next.js · Quote automation", price:"Custom web app", save:null, tag:null, img:"assets/robles-concrete-pricing-calculator.webp" },
    { name:"Souzou Cam", rating:"New", beds:"B2B field service app", price:"$49/mo team plan", save:null, tag:null, img:"assets/souzou-cam.webp", link:"https://play.google.com/store/apps/details?id=work.sitesnap.app" },
    { name:"Greeson's Fencing", rating:4.9, beds:"Fencing · WordPress build", price:"4-week turnaround", save:null, tag:null, img:"assets/greesons-fencing.webp", link:"https://greesonsfencing.com/" },
    { name:"Tattwic Timetable App", rating:"New", beds:"Mobile app · Wellness/spiritual tech", price:"iOS + Android", save:null, tag:null, img:"assets/tattwic-timetable-app.webp", link:"https://play.google.com/store/apps/details?id=com.zazendesigns.tattwapro" },
    { name:"Total Wireless Data", rating:4.8, beds:"B2B wireless hardware · Catalog build", price:"5-week turnaround", save:"~$650 less than agency rate", tag:null, img:"assets/total-wireless-data.webp", link:"https://totalwirelessdata.com/" },
    { name:"H&H Construction", rating:5.0, beds:"Remodeling · WordPress build", price:"5-week turnaround", save:"~$700 less than agency rate", tag:null, img:"assets/hh-construction.webp", link:"https://hhremodelconstruction.com/" },
    { name:"Hunter Tile & Construction", rating:5.0, beds:"Tiling · WordPress + Local SEO", price:"#1 for \"tiling contractor OKC\"", save:null, tag:null, img:"assets/hunter-tile-construction.webp", link:"https://huntertileconstruction.com/" },
    { name:"Steel Rising", rating:5.0, beds:"Industrial · Custom build", price:"5-week turnaround", save:"~$800 less than agency rate", tag:"Featured", img:"assets/steel-rising.webp", link:"https://steelrising.us/" },
    { name:"Gnostic Society", rating:5.0, beds:"Educational · WordPress build", price:"4-week turnaround", save:null, tag:"Featured", img:"assets/gnostic-society.webp", link:"https://savannahgnosis.com/" },
    { name:"Robles Concrete", rating:4.9, beds:"Concrete + epoxy flooring · WordPress build", price:"4-week turnaround", save:null, tag:null, img:"assets/robles-concrete.webp", link:"https://roblesconcreteservices.com/" },
    { name:"Adtech Motors", rating:4.8, beds:"Automotive · Custom build", price:"6-week turnaround", save:null, tag:"Featured", img:"assets/adtech-motors.webp", link:"https://adtechmotors.com/" },
    { name:"Holistica Wellness", rating:5.0, beds:"Wellness · Custom build", price:"4-week turnaround", save:"~$600 less than agency rate", tag:null, img:"assets/holistica-wellness.webp", link:"https://holisticabydiana.com/" },

  ];

  const gradients = [
    'linear-gradient(135deg,#C4573B,#8f3a26)',
    'linear-gradient(135deg,#1F6E5C,#123f34)',
    'linear-gradient(135deg,#3F5C63,#22343a)',
    'linear-gradient(135deg,#B08650,#7a5a32)',
    'linear-gradient(135deg,#5C4A6E,#372c44)',
    'linear-gradient(135deg,#2E5C4A,#183a2d)',
    'linear-gradient(135deg,#6E4A3F,#402a24)',
    'linear-gradient(135deg,#4A5C6E,#293846)',
    'linear-gradient(135deg,#6E5C2E,#463b1c)',
    'linear-gradient(135deg,#3F3F5C,#242438)'
  ];

  function starOrNew(v){ return v==="New" ? "New" : `★ ${v}`; }

  function renderRow(id, data, gradOffset){
    const el = document.getElementById(id);
    el.innerHTML = data.map((p,i) => {
      const media = p.img
        ? `<img src="${p.img}" alt="${p.name} project screenshot" loading="lazy">`
        : `<div class="ph-icon">Photo placeholder<br>— swap for project screenshot</div>`;
      const card = `
        <div class="p-card-img" style="${p.img ? '' : `background:${gradients[(i+gradOffset)%gradients.length]}`}">
          ${media}
          ${p.tag ? `<div class="p-tag"><svg class="spark" viewBox="0 0 24 24" fill="none"><path d="M12 2.75C13 8 16 11 21.25 12C16 13 13 16 12 21.25C11 16 8 13 2.75 12C8 11 11 8 12 2.75Z" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"/></svg> ${p.tag}</div>` : ''}
          <div class="p-heart"><svg viewBox="0 0 24 24" fill="rgba(0,0,0,0.18)"><path d="M12.7119 4.05957C14.5394 2.20595 16.6149 1.73525 18.3848 2.12988C20.1794 2.53016 21.7541 3.84033 22.5156 5.73926C23.9699 9.36613 22.5382 15.771 12 21.8457C1.46176 15.771 0.0301221 9.36612 1.48438 5.73926C2.24593 3.84032 3.82061 2.53016 5.61523 2.12988C7.38514 1.73525 9.4606 2.20595 11.2881 4.05957L12 4.78223L12.7119 4.05957Z" stroke="#fff" stroke-width="2"/></svg></div>
        </div>
        <h3>${p.name}</h3>
        <div class="p-meta"><span class="star">${starOrNew(p.rating)}</span> &nbsp;${p.beds}</div>
        <div class="p-price">${p.price}</div>
        ${p.save ? `<div class="p-save">${p.save}</div>` : ''}
      `;
      return p.link
        ? `<a class="p-card" href="${p.link}" target="_blank" rel="noopener">${card}</a>`
        : `<div class="p-card">${card}</div>`;
    }).join('');
  }
  renderRow('row1', row1, 0);

  // Full-bleed showcase slider — real business owners we've built for
  const showcaseSlides = [
    { img:"assets/zazen-slider-content-creator.webp", title:"Built for creators", desc:"Custom sites that keep pace with a growing content brand — fast, on-camera-ready, and easy to update." },
    { img:"assets/zazen-slider-plant-shop.webp", title:"Built for local shops", desc:"Storefront sites that turn foot traffic and search into real customers, without the agency price tag." },
    { img:"assets/zazen-slider-motorcycle-shop.webp", title:"Built for cafes and restaurants", desc:"Warm, inviting sites that bring the same care you put into your space online." },
    { img:"assets/zazen-slider-boutique.webp", title:"Built for small business owners", desc:"Clean, client-first design that helps independent businesses look — and run — like bigger ones." },
  ];

  (function initShowcase(){
    const slidesEl = document.getElementById('showcase-slides');
    const dotsEl = document.getElementById('showcase-dots');
    const titleEl = document.getElementById('showcase-title');
    const descEl = document.getElementById('showcase-desc');
    if(!slidesEl) return;

    slidesEl.innerHTML = showcaseSlides.map((s,i) =>
      `<div class="showcase-slide" data-i="${i}"><img src="${s.img}" alt="${s.title}" loading="${i===0 ? 'eager' : 'lazy'}"></div>`
    ).join('');
    dotsEl.innerHTML = showcaseSlides.map((s,i) =>
      `<button data-i="${i}" aria-label="Slide ${i+1}"></button>`
    ).join('');

    const slideEls = [...slidesEl.querySelectorAll('.showcase-slide')];
    const dotEls = [...dotsEl.querySelectorAll('button')];
    let current = 0;

    function show(i){
      slideEls.forEach((el, idx) => {
        el.classList.remove('is-active','is-prev');
        if(idx === i) el.classList.add('is-active');
        else if(idx === current) el.classList.add('is-prev');
      });
      dotEls.forEach((d, idx) => d.classList.toggle('is-active', idx === i));
      titleEl.textContent = showcaseSlides[i].title;
      descEl.textContent = showcaseSlides[i].desc;
      current = i;
    }
    show(0);

    let timer = setInterval(() => show((current + 1) % showcaseSlides.length), 5000);
    dotEls.forEach(d => d.addEventListener('click', () => {
      clearInterval(timer);
      show(parseInt(d.dataset.i, 10));
      timer = setInterval(() => show((current + 1) % showcaseSlides.length), 5000);
    }));
  })();
</script>

</body>
</html>
